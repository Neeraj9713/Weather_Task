# Continuous Integration for Weather_Task
#
# Runs on every push to dev, and every pull request into main. Nothing deploys yet on purpose —
# this is step 1: get a green pipeline running install -> prisma generate -> test.
# Deploy comes later, once this loop feels familiar.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Required before anything can `require('@prisma/client')` — the app
        # imports it as soon as src/config/prisma.js is loaded.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: Run tests
        run: npm test
        env:
          # Dummy values: today's tests only check the app boots and routes
          # mount correctly — nothing actually connects to a database or
          # calls the real weather API yet.
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          OPEN_WEATHER_API_KEY: dummy-key-for-ci
          WEATHER_API_URL: https://example.com/

  deploy-simulated:
    name: Simulated deploy (no real server yet)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (same as your manual "npm i")
        run: npm i

      - name: "Simulate: pm2 restart"
        # No real server yet, so this just proves the deploy JOB's shape and
        # its dependency on the test job. Once you have a server, replace
        # this whole step with the appleboy/ssh-action block we designed
        # earlier (or, for a true local test, switch runs-on to
        # "self-hosted" and drop the SSH step entirely).
        run: |
          echo "If this were real, we'd now run: pm2 restart 0"
          echo "Deploy job ran successfully after CI passed."
