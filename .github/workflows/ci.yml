# Continuous Integration for Weather_Task
#
# Runs on every push to dev, and every pull request into main. Nothing deploys yet on purpose —
# this is step 1: get a green pipeline running install -> prisma generate -> test.
# Deploy comes later, once this loop feels familiar.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Required before anything can `require('@prisma/client')` — the app
        # imports it as soon as src/config/prisma.js is loaded.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: Run tests
        run: npm test
        env:
          # Dummy values: today's tests only check the app boots and routes
          # mount correctly — nothing actually connects to a database or
          # calls the real weather API yet.
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          OPEN_WEATHER_API_KEY: dummy-key-for-ci
          WEATHER_API_URL: https://example.com/

  deploy-local:
    name: Deploy on your own PC (self-hosted runner)
    needs: test
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        # Self-hosted runner still needs this to make sure the working
        # folder matches the exact commit that just passed CI.
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm i

      - name: Show deploy would happen here
        # This is genuinely running on Neeraj's own Windows PC now (the
        # self-hosted runner), not GitHub's cloud machine. Once pm2 is set
        # up for this app on this PC, replace this step with:
        #   pm2 restart weather-task || pm2 start src/server.js --name weather-task
        run: |
          echo "Running on the self-hosted runner - this IS your PC."
          echo "Next real step here would be: pm2 restart <app-name>"
